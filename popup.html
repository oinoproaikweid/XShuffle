<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xshuffle</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="xshuffle-popup-body">
    <main class="xshuffle-window xshuffle-popup">
      <header class="xshuffle-titlebar">Xshuffle</header>
      <div class="xshuffle-popup-content">
        <div class="xshuffle-popup-label">Show Shuffle UI</div>
        <label class="xshuffle-toggle xshuffle-inset">
          <input id="show-shuffle-ui" type="checkbox" checked>
          <span id="toggle-status">Enabled</span>
        </label>

        <div class="xshuffle-popup-label">Search options</div>

        <label class="xshuffle-check">
          <input id="opt-exclude-replies" type="checkbox">
          <span>Hide replies</span>
        </label>

        <label class="xshuffle-check">
          <input id="opt-media-only" type="checkbox">
          <span>Photos and video only</span>
        </label>

        <label class="xshuffle-check">
          <input id="opt-single-post" type="checkbox">
          <span>Open one post instead of a result list</span>
        </label>

        <div class="xshuffle-popup-label">Date range</div>
        <div class="xshuffle-range">
          <label class="xshuffle-range-field">
            <span>From</span>
            <input id="opt-range-start" type="date">
          </label>
          <label class="xshuffle-range-field">
            <span>To</span>
            <input id="opt-range-end" type="date">
          </label>
        </div>
        <div class="xshuffle-hint">Leave blank to size the range from how often the account posts.</div>

        <div id="rate-limit-notice" class="xshuffle-notice" hidden></div>

        <div class="xshuffle-footer">
          <button id="close-popup" class="xshuffle-button" type="button">Close</button>
        </div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
